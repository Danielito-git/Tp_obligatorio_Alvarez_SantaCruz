<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticket</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilos.css">
  <script type="module" src="jsFrontend/ticket.js"></script>
</head>
<body>
  <header id="encabezado" class="encabezado"></header>

  <main class="ticket">
    <article class="ticketTarjeta" aria-labelledby="tituloTicket">
      <div class="ticketCabecera">
        <img src="img/logo.svg" alt="" class="ticketLogo" width="56" height="56">
        <div>
          <p id="ticketEmpresa" class="ticketEmpresa"></p>
          <h1 id="tituloTicket">Ticket de compra</h1>
        </div>
      </div>

      <dl class="ticketDatos">
        <dt>Cliente</dt>
        <dd id="ticketCliente"></dd>
        <dt>Fecha</dt>
        <dd id="ticketFecha"></dd>
      </dl>

      <table class="ticketTabla">
        <thead>
          <tr>
            <th scope="col">Producto</th>
            <th scope="col">Cant.</th>
            <th scope="col">Precio unit.</th>
            <th scope="col">Subtotal</th>
          </tr>
        </thead>
        <tbody id="ticketLineas"></tbody>
        <tfoot>
          <tr>
            <th scope="row" colspan="3">Total</th>
            <td id="ticketTotal"></td>
          </tr>
        </tfoot>
      </table>

      <p class="ticketGracias">¡Gracias por tu compra!</p>

      <button id="botonSalir" type="button" class="boton botonPrimario botonGrande botonAncho">
        <span class="icono iconoSalir" aria-hidden="true"></span>
        <span class="botonTexto">Salir</span>
      </button>
    </article>
  </main>

  <footer id="pie" class="pie"></footer>
</body>
</html>
